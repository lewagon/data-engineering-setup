---
- name: Setup VM Part 2 - Update VM with dependant software
  hosts: localhost
  connection: local
  become: true
  vars:
    my_user: "{{ lookup('env', 'USER') }}"
    architecture: "{{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}"
    ansible_shell_executable: /usr/bin/zsh
    spark_version: "3.5.3"
    python_version: "3.12.8"
  tasks:
    - name: Debug Variables
      ansible.builtin.debug:
        msg:
          - "Running playbook as the user: {{ my_user }}"
          - "Running Ubuntu version: {{ ansible_distribution_release }}"
          - "On architecture: {{ architecture }}"

    - name: Check if Spark is installed
      ansible.builtin.stat:
        path: "/home/{{ my_user }}/spark/spark-{{ spark_version }}-bin-hadoop3"
      register: spark_installed

    - name: Install Spark
      tags: spark
      when: not spark_installed.stat.exists
      block:
        - name: Ensure Spark directory exists
          ansible.builtin.file:
            path: "/home/{{ my_user }}/spark"
            state: directory
            mode: "0755"
            owner: "{{ my_user }}"
            group: "{{ my_user }}"
          become: true

        - name: Install Spark
          ansible.builtin.unarchive:
            src: "https://archive.apache.org/dist/spark/spark-{{ spark_version }}/spark-{{ spark_version }}-bin-hadoop3.tgz"
            dest: "/home/{{ my_user }}/spark"
            remote_src: true
          become_user: "{{ my_user }}"
          become: true

    - name: Add .zshrc plugins - direnv, pyenv, gcloud
      ansible.builtin.lineinfile:
        path: "~/.zshrc"
        regexp: "plugins="
        line: "plugins=(git gitfast last-working-dir common-aliases zsh-syntax-highlighting history-substring-search pyenv ssh-agent direnv gcloud)"
        create: true
        mode: '0644'
      become_user: "{{ my_user }}"
      become: true
      tags: zshrc

    - name: Add Spark, pyenv, pipx to PATH
      ansible.builtin.blockinfile:
        path: "~/.zshrc"
        block: |
          # Spark
          export SPARK_HOME=$HOME/spark/spark-{{ spark_version }}-bin-hadoop3
          export PATH=$PATH:$SPARK_HOME/bin

          # pyenv
          export PYENV_ROOT="$HOME/.pyenv"
          [[ -d $PYENV_ROOT/bin ]] && export PATH="$PYENV_ROOT/bin:$PATH"
          eval "$(pyenv init - zsh)"

          # pipx
          export PATH="$HOME/.local/bin:$PATH"
        marker: "# {mark} ANSIBLE CREATED BLOCK: path vars"
        create: true
        mode: '0644'
      become_user: "{{ my_user }}"
      become: true
      tags: zshrc

    - name: Create direnv Poetry function
      ansible.builtin.blockinfile:
        path: "~/.direnvrc"
        block: |
          layout_poetry() {
            if [[ ! -f pyproject.toml ]]; then
                log_error 'No pyproject.toml found. Use `poetry new` or `poetry init` to create one first.'
                exit 2
            fi
            # create venv if it doesn't exist
            poetry run true

            export VIRTUAL_ENV=$(poetry env info --path)
            export POETRY_ACTIVE=1
            PATH_add "$VIRTUAL_ENV/bin"
          }
        marker: "# {mark} ANSIBLE CREATED BLOCK: layout_poetry"
        create: true
        mode: '0644'
      become_user: "{{ my_user }}"
      become: true

    - name: VS Code Config
      tags: vscode
      block:
        - name: Detect VS Code CLI path
          ansible.builtin.shell: |
            set -o pipefail
            find /home/{{ my_user }}/.vscode-server/cli/servers/ -maxdepth 5 -type f -name "code" | head -n 1
          register: vscode_cli_path
          changed_when: false

        - name: Check installed VS Code extensions
          ansible.builtin.command: "{{ vscode_cli_path.stdout }} --list-extensions"
          register: vscode_installed_extensions
          changed_when: false
          when: vscode_cli_path.stdout | length > 0

        - name: Install additional VS Code extensions
          ansible.builtin.command: "{{ vscode_cli_path.stdout }} --install-extension {{ item }}"
          loop:
            - ms-vscode.sublime-keybindings
            - emmanuelbeziat.vscode-great-icons
            - ms-python.python
            - ms-python.vscode-pylance
            - KevinRose.vsc-python-indent
            - redhat.vscode-yaml
            - ms-azuretools.vscode-containers
            - tamasfe.even-better-toml
          when: vscode_cli_path.stdout | length > 0 and vscode_installed_extensions.stdout is defined and (item not in vscode_installed_extensions.stdout)
          changed_when: true
          become_user: "{{ my_user }}"
          become: true

        - name: Updated VS Code settings for Python development
          block:
            - name: Read VS Code settings
              ansible.builtin.slurp:
                src: "~/.vscode-server/data/Machine/settings.json"
              register: vscode_settings_raw
              failed_when: false
              become_user: "{{ my_user }}"
              become: true

            - name: Parse settings and strip comments
              ansible.builtin.set_fact:
                vscode_settings: >-
                  {{
                    (vscode_settings_raw.content | default('e30=') | b64decode |
                    regex_replace('^\s*//.*$', '', multiline=True) |
                    regex_replace(',\s*\n\s*}', '\n}', multiline=True) |
                    from_json) | default({})
                  }}

            - name: Ensure files.exclude exists
              ansible.builtin.set_fact:
                vscode_settings: "{{ vscode_settings | combine({'files.exclude': {}}) }}"
              when: vscode_settings['files.exclude'] is not defined

            - name: Update Python and visibility settings
              ansible.builtin.set_fact:
                vscode_settings: >-
                  {{
                    vscode_settings | combine({
                      'python.defaultInterpreterPath': '.venv/bin/python',
                      'files.exclude': vscode_settings['files.exclude'] | combine({
                        '__pycache__': false,
                        '.pytest_cache': false,
                        'dist': false,
                        '.git': false,
                        '**/.git': false,
                      }),
                      'workbench.panel.defaultLocation': 'bottom'
                    }, recursive=True)
                  }}

            - name: Write updated settings
              ansible.builtin.copy:
                content: "{{ vscode_settings | to_nice_json }}"
                dest: "~/.vscode-server/data/Machine/settings.json"
                mode: '0644'
              become_user: "{{ my_user }}"
              become: true

    - name: Install pyenv
      tags: python
      block:
        - name: Check if pyenv is installed
          ansible.builtin.stat:
            path: "/home/{{ my_user }}/.pyenv"
          register: pyenv_installed

        - name: Install pyenv # noqa latest[git]
          ansible.builtin.git:
            repo: "https://github.com/pyenv/pyenv.git"
            dest: "/home/{{ my_user }}/.pyenv"
          become_user: "{{ my_user }}"
          become: true
          when: not pyenv_installed.stat.exists

    - name: Install pyenv-virtualenv
      tags: python
      block:
        - name: Check if pyenv-virtualenv is installed
          ansible.builtin.stat:
            path: "/home/{{ my_user }}/.pyenv/plugins/pyenv-virtualenv"
          register: pyenv_virtualenv_installed

        - name: Install pyenv-virtualenv # noqa latest[git]
          ansible.builtin.git:
            repo: "https://github.com/pyenv/pyenv-virtualenv.git"
            dest: "/home/{{ my_user }}/.pyenv/plugins/pyenv-virtualenv"
          become_user: "{{ my_user }}"
          become: true
          when: not pyenv_virtualenv_installed.stat.exists

    - name: Install Python using pyenv
      tags: python
      block:
        - name: Check if Python is installed
          ansible.builtin.command: >
            zsh -c 'export PYENV_ROOT="$HOME/.pyenv";
            export PATH="$PYENV_ROOT/bin:$PATH";
            eval "$(pyenv init --path)";
            pyenv versions --bare'
          become_user: "{{ my_user }}"
          become: true
          register: python_installed
          changed_when: false

        - name: Install Python with pyenv - takes a while
          ansible.builtin.command: >
            zsh -c 'export PYENV_ROOT="$HOME/.pyenv";
            export PATH="$PYENV_ROOT/bin:$PATH";
            eval "$(pyenv init --path)";
            pyenv install {{ python_version }} && pyenv global {{ python_version }}'
          become_user: "{{ my_user }}"
          become: true
          when: python_version not in python_installed.stdout
          changed_when: true

    - name: Install pipx
      tags: pipx
      block:
        - name: Check if pipx is installed
          ansible.builtin.stat:
            path: "/home/{{ my_user }}/.local/bin/pipx"
          register: pipx_installed

        - name: Install pipx
          ansible.builtin.shell: |
            source ~/.zshrc
            pip install --upgrade pip
            python -m ensurepip --default-pip
            python -m pip install --user pipx
            python -m pipx ensurepath
          become_user: "{{ my_user }}"
          become: true
          when: not pipx_installed.stat.exists
          changed_when: true

    - name: Install pipx packages
      tags: pipx
      block:
        - name: Check installed pipx packages
          ansible.builtin.command: "/home/{{ my_user }}/.local/bin/pipx list"
          become_user: "{{ my_user }}"
          become: true
          register: pipx_list
          changed_when: false

        - name: Install missing pipx packages - poetry, tldr, ruff
          ansible.builtin.command: "/home/{{ my_user }}/.local/bin/pipx install {{ item }}"
          loop:
            - poetry
            - tldr
            - ruff
          become_user: "{{ my_user }}"
          become: true
          when: "item not in pipx_list.stdout"
          changed_when: true

    - name: Ensure Poetry venv is set to in-project
      ansible.builtin.shell: |
        source ~/.zshrc
        poetry config virtualenvs.in-project true
      become_user: "{{ my_user }}"
      become: true
      changed_when: false

    - name: Get GitHub Username using gh CLI
      ansible.builtin.command: gh api user --jq '.login'
      become_user: "{{ my_user }}"
      become: true
      register: github_username
      changed_when: false
      tags: github

    - name: Fork lewagon/data-engineering-challenges
      tags: github
      block:
        - name: Check if lewagon/data-engineering-challenges has been forked
          ansible.builtin.command: >
            gh repo list
            --json nameWithOwner
            --jq '.[] | select(.nameWithOwner == "{{ github_username.stdout }}/data-engineering-challenges")'
          become_user: "{{ my_user }}"
          become: true
          register: fork_exists
          changed_when: false
          failed_when: false

        - name: Fork lewagon/data-engineering-challenges repo to your GitHub account
          ansible.builtin.command: gh repo fork lewagon/data-engineering-challenges --remote
          become_user: "{{ my_user }}"
          become: true
          when: fork_exists.stdout | trim == ""
          changed_when: true

        - name: Wait for fork to be fully available
          ansible.builtin.command: "gh repo view {{ github_username.stdout }}/data-engineering-challenges"
          become_user: "{{ my_user }}"
          become: true
          register: fork_ready
          retries: 10
          delay: 10
          until: fork_ready.rc == 0
          changed_when: false

    - name: Clone and configure local repository
      tags: github
      block:
        - name: Check if data-engineering-challenges repo exists locally
          ansible.builtin.stat:
            path: "/home/{{ my_user }}/code/{{ github_username.stdout }}/data-engineering-challenges"
          register: local_repo_exists

        - name: Clone data-engineering-challenges from your GitHub to VM # noqa latest[git]
          ansible.builtin.git:
            repo: "git@github.com:{{ github_username.stdout }}/data-engineering-challenges.git"
            dest: "/home/{{ my_user }}/code/{{ github_username.stdout }}/data-engineering-challenges"
            clone: true
            update: false
            accept_hostkey: true
          become_user: "{{ my_user }}"
          become: true
          when: not local_repo_exists.stat.exists
          changed_when: true

        - name: Check data-engineering-challenges git remotes # noqa command-instead-of-module
          ansible.builtin.command: git remote -v
          args:
            chdir: "/home/{{ my_user }}/code/{{ github_username.stdout }}/data-engineering-challenges"
          become_user: "{{ my_user }}"
          become: true
          register: existing_remotes
          changed_when: false

        - name: Add upstream remote to data-engineering-challenges # noqa command-instead-of-module
          ansible.builtin.command: git remote add upstream git@github.com:lewagon/data-engineering-challenges.git
          args:
            chdir: "/home/{{ my_user }}/code/{{ github_username.stdout }}/data-engineering-challenges"
          become_user: "{{ my_user }}"
          become: true
          when: "'upstream' not in existing_remotes.stdout"
          changed_when: true

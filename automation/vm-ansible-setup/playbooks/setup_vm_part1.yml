---
- name: Setup VM Part 1 - Update VM with non-dependant software
  hosts: localhost
  connection: local
  become: true
  vars:
    my_user: "{{ lookup('env', 'USER') }}"
    architecture: "{{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}"
  tasks:
    - name: Debug Variables
      ansible.builtin.debug:
        msg:
          - "Running playbook as the user: {{ my_user }}"
          - "Running Ubuntu version: {{ ansible_distribution_release }}"
          - "On architecture: {{ architecture }}"

    - name: Apt update, upgrade, and install
      become: true
      tags: apt
      block:
        - name: Update and upgrade apt packages
          ansible.builtin.apt:
            update_cache: true
            upgrade: dist
          environment:
            DEBIAN_FRONTEND: noninteractive
            NEEDRESTART_MODE: a

        - name: Install required apt packages
          ansible.builtin.apt:
            name:
              - vim
              - tmux
              - tree
              - git
              - ca-certificates
              - curl
              - jq
              - unzip
              - zsh
              - apt-transport-https
              - gnupg
              - software-properties-common
              - direnv
              - sqlite3
              - make
              - postgresql
              - postgresql-contrib
              - build-essential
              - libssl-dev
              - zlib1g-dev
              - libbz2-dev
              - libreadline-dev
              - libsqlite3-dev
              - wget
              - llvm
              - libncursesw5-dev
              - xz-utils
              - tk-dev
              - libxml2-dev
              - libxmlsec1-dev
              - libffi-dev
              - liblzma-dev
              - gcc
              - default-mysql-server
              - default-libmysqlclient-dev
              - libpython3-dev
              - openjdk-8-jdk-headless
            state: present


    - name: Set zsh as default shell
      ansible.builtin.user:
        name: "{{ my_user }}"
        shell: /usr/bin/zsh

    - name: Install Oh My Zsh
      tags: omz
      block:
        - name: Check if Oh My Zsh is installed
          ansible.builtin.stat:
            path: "/home/{{ my_user }}/.oh-my-zsh"
          register: omz_check

        - name: Install Oh My Zsh from repo
          ansible.builtin.shell: |
            sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
          become_user: "{{ my_user }}"
          become: true
          when: not omz_check.stat.exists
          changed_when: true

    - name: Check if Docker is installed
      ansible.builtin.stat:
        path: /usr/bin/docker
      register: docker_check
      tags: docker

    - name: Install Docker
      tags: docker
      when: not docker_check.stat.exists
      block:
        - name: Create keyrings directory
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'

        - name: Add Docker GPG key
          ansible.builtin.get_url:
            url: "https://download.docker.com/linux/ubuntu/gpg"
            dest: "/etc/apt/keyrings/docker.gpg"
            mode: '0644'

        - name: Add Docker APT repository
          ansible.builtin.apt_repository:
            repo: >
              deb [arch={{ architecture }} signed-by=/etc/apt/keyrings/docker.gpg]
              https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
            state: present

        - name: Update APT cache
          ansible.builtin.apt:
            update_cache: true

        - name: Install Docker packages
          ansible.builtin.apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: present

    - name: Ensure docker group exists
      ansible.builtin.group:
        name: docker
        state: present
      tags: docker

    - name: Add user to the docker group
      ansible.builtin.user:
        name: "{{ my_user }}"
        groups: docker
        append: true
      tags: docker

    - name: Authenticate gcloud with Docker
      tags: docker
      block:
        - name: Check if Docker authentication config exists
          ansible.builtin.stat:
            path: "/home/{{ my_user }}/.docker/config.json"
          register: docker_config

        - name: Check if gcloud is authenticated with Docker
          ansible.builtin.command: "grep -q 'gcr.io' /home/{{ my_user }}/.docker/config.json"
          become_user: "{{ my_user }}"
          become: true
          register: gcloud_docker_check
          ignore_errors: true
          changed_when: false
          when: docker_config.stat.exists

        - name: Authenticate gcloud with Docker
          ansible.builtin.shell: |
            gcloud auth configure-docker
          become_user: "{{ my_user }}"
          become: true
          when: not docker_config.stat.exists or gcloud_docker_check.rc != 0
          changed_when: true

    - name: Enable GCP Artifact Registry API
      tags: gcp_ar
      block:
        - name: Check if GCP Artifact Registry API is enabled
          ansible.builtin.shell: |
            set -o pipefail
            gcloud services list --enabled --format="value(config.name)" | grep -q "^artifactregistry.googleapis.com$"
          become_user: "{{ my_user }}"
          become: true
          register: gcp_ar_check
          ignore_errors: true
          changed_when: false

        - name: Enable GCP Artifact Registry API
          ansible.builtin.shell: |
            gcloud services enable artifactregistry.googleapis.com
          become_user: "{{ my_user }}"
          become: true
          when: gcp_ar_check.rc != 0
          changed_when: true

    - name: Install kubectl
      tags: kubectl
      block:
        - name: Check if kubectl is installed
          ansible.builtin.stat:
            path: /usr/local/bin/kubectl
          register: kubectl_check

        - name: Download kubectl binary and add to path
          ansible.builtin.get_url:
            url: "https://dl.k8s.io/release/{{ lookup('url', 'https://dl.k8s.io/release/stable.txt') }}/bin/linux/amd64/kubectl"
            dest: "/usr/local/bin/kubectl"
            mode: '0755'
          when: not kubectl_check.stat.exists

    - name: Install minikube
      tags: minikube
      block:
        - name: Check if minikube is installed
          ansible.builtin.stat:
            path: /usr/local/bin/minikube
          register: minikube_check

        - name: Download minikube binary and add to path
          ansible.builtin.get_url:
            url: "https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64"
            dest: "/usr/local/bin/minikube"
            mode: '0755'
          when: not minikube_check.stat.exists

    - name: Check if terraform is installed
      ansible.builtin.stat:
        path: /usr/bin/terraform
      register: terraform_check
      tags: terraform

    - name: Install terraform
      tags: terraform
      when: not terraform_check.stat.exists
      block:
        - name: Add HashiCorp GPG key
          ansible.builtin.get_url:
            url: "https://apt.releases.hashicorp.com/gpg"
            dest: "/usr/share/keyrings/hashicorp-archive-keyring.gpg"
            mode: '0644'

        - name: Add HashiCorp APT repository
          ansible.builtin.apt_repository:
            repo: >
              deb [arch={{ architecture }} signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg]
              https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main
            state: present

        - name: Update APT cache
          ansible.builtin.apt:
            update_cache: true

        - name: Install terraform
          ansible.builtin.apt:
            name: terraform
            state: present

    - name: Check if Github CLI is installed
      ansible.builtin.stat:
        path: /usr/bin/gh
      register: gh_check
      tags: gh_cli

    - name: Install Github CLI
      tags: gh_cli
      when: not gh_check.stat.exists
      block:
        - name: Add GitHub CLI GPG key
          ansible.builtin.get_url:
            url: "https://cli.github.com/packages/githubcli-archive-keyring.gpg"
            dest: "/usr/share/keyrings/githubcli-archive-keyring.gpg"
            mode: '0644'

        - name: Add GitHub CLI APT repository
          ansible.builtin.apt_repository:
            repo: >
              deb [arch={{ architecture }} signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg]
              https://cli.github.com/packages stable main
            state: present

        - name: Install GitHub CLI
          ansible.builtin.apt:
            name: gh
            state: present
